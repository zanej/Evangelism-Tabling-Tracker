<!DOCTYPE html>
<html>
<head>
    <title>Add Conversation - THRIVE</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fdfdfd;
            padding: 30px;
        }
        h1 {
            color: #500000;
            text-align: center;
        }
        form {
            max-width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
        }
        input, textarea {
            padding: 10px;
            font-size: 1em;
        }
        .btn {
            background-color: #500000;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #500000;
        }
    </style>
</head>
<body>
    <h1>Add Conversation</h1>
    <form method="POST">
        <label>Name</label>
        <input type="text" name="name" required>

        <label>Contact Info</label>
        <input type="text" name="contact_info">

        <label>Spiritual Topic</label>
        <input type="text" name="topic" required>

        <label>Prayer Request</label>
        <textarea name="prayer_request"></textarea>

        <label><input type="checkbox" name="follow_up_needed"> Follow-Up Needed?</label>

        <button type="submit" class="btn">Save Conversation</button>
    </form>
    <a href="/">← Back to Log</a>
</body>
</html>
